<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LPrint – Audio to Record STL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=Archivo+Narrow:wght@500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: präzise Werkstatt, ruhig, technisch ehrlich
   IDEA: ein Plattenlabel / Schneidemaschine – die Platte selbst ist das Werkstück
   PICTURE: die live berechnete Platte mit echter Spirale + Mikroskop-Ansicht der Rille
   COLOUR and TYPE: Vinylschwarz, weißes Papier, Labelrot als einziger Akzent; Archivo
   LAYOUT: Bedienspalte links, große Platte rechts, darunter Messwerte und Druckhinweise */
:root{color-scheme:light dark;--bg:light-dark(#fbfbf9,#111112);--ink:light-dark(#141414,#ecebe7);--mute:light-dark(#5d5d5a,#a3a29d);--line:light-dark(#dcdbd6,#2c2c2e);--panel:light-dark(#ffffff,#1a1a1c);--vinyl:#0d0d0e;--red:#e2321c;--redink:light-dark(#b8240f,#ff6a52);--ok:light-dark(#1d6b3a,#6fd39a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Archivo,system-ui,'Noto Sans','PingFang SC','Hiragino Sans','Microsoft YaHei',sans-serif;overflow-x:clip}
h1,h2,h3{font-weight:800;line-height:1.08;text-wrap:balance;margin:0}
h1{font-size:clamp(32px,5vw,50px);letter-spacing:-.02em}
h2{font-size:26px;margin-bottom:14px}
h3{font-size:17px;margin:0 0 6px}
p{margin:0 0 12px;max-width:68ch}
.band{padding:clamp(24px,4vw,56px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
header.band{padding-bottom:12px}
.lead{color:var(--mute);font-size:17px;margin-top:10px}
.tool{display:grid;grid-template-columns:minmax(0,390px) minmax(0,1fr);gap:28px;align-items:start}
@media(max-width:900px){.tool{grid-template-columns:minmax(0,1fr)}.stage{order:-1}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.stack-gap>*+*{margin-top:14px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;cursor:pointer;transition:border-color .2s}
.drop.hot,.drop:hover{border-color:var(--red)}
.drop strong{display:block;font-size:17px}
.drop small{color:var(--mute)}
label{display:block;font-size:14px;font-weight:500;color:var(--mute);margin-bottom:4px}
select,input[type=number],input[type=text]{width:100%;font:16px Archivo,sans-serif;padding:9px 10px;min-height:44px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--red);min-height:32px}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);font:600 15px 'Archivo Narrow',Archivo,sans-serif;min-height:44px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--vinyl);color:#fff}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--ink);font-weight:400;margin:8px 0;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--red);margin-top:2px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;border-radius:10px;border:0;font:700 16px Archivo,sans-serif;cursor:pointer;background:var(--vinyl);color:#fff}
:root[data-theme=dark] .btn,.btn{outline-offset:3px}
.btn.red{background:var(--red)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
details.adv summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.stage{position:relative}
.discbox{position:relative;aspect-ratio:1;max-width:620px;margin:0 auto;border-radius:50%}
.discbox canvas{position:absolute;inset:0;width:100%;height:100%}
.empty[hidden]{display:none}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#cfcfcb;font-size:15px;padding:30%}
.micro{margin-top:18px}
.micro .fig{position:relative;height:190px;border-radius:12px;overflow:hidden;background:#151517}
.micro .fig canvas{position:absolute;inset:0;width:100%;height:100%}
.cap{font-size:13px;color:var(--mute);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:18px}
.stats div{background:var(--panel);padding:10px 12px;box-shadow:0 0 0 1px var(--line)}
.stats b{display:block;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats span{font-size:13px;color:var(--mute)}
.msg{font-size:15px;padding:10px 12px;border-radius:10px;background:light-dark(#fff1ee,#2a1613);color:var(--redink);display:none}
.msg.show{display:block}
.msg.good{background:light-dark(#ecf7f0,#12251a);color:var(--ok)}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;display:none}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .15s}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.tips ul{margin:0;padding-left:20px}.tips li{margin-bottom:6px}
footer{color:var(--mute);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.langsel{display:flex;align-items:center;gap:8px;margin:0}.langsel select{width:auto}
[dir=rtl] .stats b{direction:ltr;text-align:right}#pos{direction:ltr}
.pill{display:inline-block;font-size:13px;padding:2px 9px;border-radius:99px;background:var(--line);color:var(--ink);white-space:nowrap}
@media(max-width:600px){.row3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="band"><div class="wrap">
  <div class="top"><h1>LPrint</h1>
    <label class="langsel"><span data-i18n="lang">Language</span><select id="lang"></select></label></div>
  <p class="lead" data-i18n="lead"></p>
</div></header>

<main class="band" style="padding-top:12px"><div class="wrap tool">
  <section class="stack-gap">
    <div class="card stack-gap">
      <div class="drop" id="drop" tabindex="0" role="button" data-i18n-aria="drop_aria">
        <strong id="fname" data-i18n="drop_title"></strong>
        <small id="finfo" data-i18n="drop_hint"></small>
        <input type="file" id="file" accept="audio/*,.wav,.mp3,.flac,.ogg,.m4a" hidden>
      </div>
      <button class="btn ghost" id="testsig" type="button" data-i18n="test_btn"></button>
    </div>

    <div class="card stack-gap">
      <div><label data-i18n="lbl_disc"></label>
        <div class="seg" id="segDisc"><button data-v="5">5″</button><button data-v="7" aria-pressed="true">7″</button><button data-v="10">10″</button><button data-v="12">12″</button></div></div>
      <div><label data-i18n="lbl_speed"></label>
        <div class="seg" id="segRpm"><button data-v="33.333333">33⅓</button><button data-v="45" aria-pressed="true">45</button><button data-v="78">78</button></div></div>
      <div><label data-i18n="lbl_channels"></label>
        <div class="seg" id="segMode"><button data-v="mono" aria-pressed="true" data-i18n="mono"></button><button data-v="stereo" data-i18n="stereo"></button></div></div>
      <div><label for="printer" data-i18n="lbl_printer"></label>
        <select id="printer">
          <option value="p1s02" selected data-i18n="pr_p1s02"></option>
          <option value="p1s04" data-i18n="pr_p1s04"></option>
          <option value="r16" data-i18n="pr_r16"></option>
          <option value="r12" data-i18n="pr_r12"></option>
          <option value="r8" data-i18n="pr_r8"></option>
          <option value="r4" data-i18n="pr_r4"></option>
        </select></div>
      <label class="chk"><input type="checkbox" id="compress" checked> <span data-i18n="chk_comp"></span></label>
      <label class="chk"><input type="checkbox" id="autofit" checked> <span data-i18n="chk_fit"></span></label>

      <details class="adv">
        <summary data-i18n="adv"></summary>
        <div class="stack-gap">
          <div class="row">
            <div><label for="sr" data-i18n="lbl_sr"></label><select id="sr"><option>4000</option><option>6000</option><option>8000</option><option>11025</option><option selected>16000</option><option>22050</option></select></div>
            <div><label for="px" data-i18n="lbl_px"></label><input type="number" id="px" step="1" min="5"></div>
          </div>
          <div class="row3">
            <div><label for="gw" data-i18n="lbl_gw"></label><input type="number" id="gw" step="5" min="40"></div>
            <div><label for="amp" data-i18n="lbl_amp"></label><input type="number" id="amp" step="5" min="5"></div>
            <div><label for="land" data-i18n="lbl_land"></label><input type="number" id="land" step="5" min="10"></div>
          </div>
          <div class="row3">
            <div><label for="slope" data-i18n="lbl_slope"></label><input type="number" id="slope" step="0.05" min="0.1" max="1.5"></div>
            <div><label for="hp" data-i18n="lbl_hp"></label><input type="number" id="hp" step="5" min="0"></div>
            <div><label for="lp" data-i18n="lbl_lp"></label><input type="number" id="lp" step="100" min="0" value="0"></div>
          </div>
          <div class="row3">
            <div><label for="diam" data-i18n="lbl_diam"></label><input type="number" id="diam" step="0.1"></div>
            <div><label for="rstart" data-i18n="lbl_rstart"></label><input type="number" id="rstart" step="0.1"></div>
            <div><label for="rmin" data-i18n="lbl_rmin"></label><input type="number" id="rmin" step="0.1"></div>
          </div>
          <div class="row">
            <div><label for="thick" data-i18n="lbl_thick"></label><input type="number" id="thick" step="0.1" value="2.6"></div>
            <div><label for="hole" data-i18n="lbl_hole"></label><input type="number" id="hole" step="0.01" value="7.24"></div>
          </div>
          <label class="chk"><input type="checkbox" id="riaa" checked> <span data-i18n="chk_riaa"></span></label>
          <label class="chk"><input type="checkbox" id="trim" checked> <span data-i18n="chk_trim"></span></label>
        </div>
      </details>
    </div>

    <div class="card stack-gap">
      <button class="btn" id="calc" type="button" disabled data-i18n="btn_calc"></button>
      <div class="row">
        <button class="btn ghost" id="play" type="button" disabled data-i18n="btn_play"></button>
        <button class="btn ghost" id="stop" type="button" disabled data-i18n="btn_stop"></button>
      </div>
      <button class="btn red" id="stl" type="button" disabled data-i18n="btn_stl"></button>
      <div class="bar" id="bar"><i></i></div>
      <div class="msg" id="msg" role="status"></div>
    </div>
  </section>

  <section class="stage">
    <div class="discbox"><canvas id="disc"></canvas><div class="empty" id="empty" data-i18n="empty"></div></div>
    <div class="micro">
      <h3 data-i18n="micro_title"></h3>
      <div class="fig"><canvas id="detail"></canvas></div>
      <input type="range" id="pos" min="0" max="1000" value="300" data-i18n-aria="pos_aria" disabled>
      <div class="cap" id="detcap" data-i18n="detcap0"></div>
    </div>
    <div class="stats" id="stats" hidden></div>
  </section>
</div></main>

<section class="band" style="background:var(--vinyl);color:#ecebe7"><div class="wrap">
  <h2 data-i18n="tips_title"></h2>
  <div class="tips">
    <div><h3 data-i18n="tb_h"></h3><ul><li data-i18n="tb1"></li><li data-i18n="tb2"></li><li data-i18n="tb3"></li><li data-i18n="tb4"></li></ul></div>
    <div><h3 data-i18n="tr_h"></h3><ul><li data-i18n="tr1"></li><li data-i18n="tr2"></li><li data-i18n="tr3"></li><li data-i18n="tr4"></li></ul></div>
    <div><h3 data-i18n="tp_h"></h3><ul><li data-i18n="tp1"></li><li data-i18n="tp2"></li><li data-i18n="tp3"></li><li data-i18n="tp4"></li></ul></div>
    <div><h3 data-i18n="tq_h"></h3><ul><li data-i18n="tq1"></li><li data-i18n="tq2"></li><li data-i18n="tq3"></li><li data-i18n="tq4"></li></ul></div>
  </div>
</div></section>
<footer class="band"><div class="wrap" data-i18n="footer"></div></footer>

tp_h: 'Abspielen', tp1: 'Nadel von Hand in die breite Einlaufrille setzen. Am Ende läuft die Rille in eine Auslaufspirale und endet – Arm anheben.', tp2: 'Mit günstiger konischer Nadel testen, nicht mit der guten. Normale Auflagekraft.', tp3: 'Über einen Phono-Eingang mit RIAA abspielen. Ohne Phono-Vorverstärker die RIAA-Option ausschalten.', tp4: 'Die Vorschau spielt das gefilterte Signal – die Druckauflösung bringt zusätzlich Rauschen und Höhenverlust.',
tq_h: 'Was die Qualität bestimmt', tq1: 'Rillengeschwindigkeit: 45 oder 78 U/min und große Radien geben mehr Höhen. Außen klingt es besser als innen.', tq2: 'Detailgröße: Wellenlängen unter ca. 2–3 kleinsten Details lassen sich nicht drucken. Die Messwerte zeigen die Grenze außen und innen.', tq3: 'Kürzere Stücke erlauben größere Auslenkung, also mehr Pegel und weniger Rauschen.', tq4: 'Mono ist robuster. Stereo nutzt zusätzlich die Rillentiefe und reagiert empfindlicher auf Schichtstufen.',
footer: 'Die STL wird als ZIP gespeichert (enthält die .stl und eine Parameterdatei). Rille: V-Rille 90°, innere Flanke = linker Kanal, äußere Flanke = rechter Kanal, Drehrichtung im Uhrzeigersinn von oben.',

<script id="core" type="text/plain">// ===================== LP-Print Kern (DSP + Rillen-Layout + STL) =====================
// Einheiten: Geometrie in mm, Zeit in Samples.

function rbj(type, f0, Q, fs) {
  const w0 = 2 * Math.PI * f0 / fs, cw = Math.cos(w0), sw = Math.sin(w0), al = sw / (2 * Q);
  let b0, b1, b2;
  if (type === 'lp') { b0 = (1 - cw) / 2; b1 = 1 - cw; b2 = (1 - cw) / 2; }
  else { b0 = (1 + cw) / 2; b1 = -(1 + cw); b2 = (1 + cw) / 2; }
  const a0 = 1 + al, a1 = -2 * cw, a2 = 1 - al;
  return [b0 / a0, b1 / a0, b2 / a0, a1 / a0, a2 / a0];
}
function biquad(x, c) {
  const b0 = c[0], b1 = c[1], b2 = c[2], a1 = c[3], a2 = c[4];
  let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
  for (let i = 0; i < x.length; i++) {
    const xi = x[i];
    const y = b0 * xi + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2;
    x2 = x1; x1 = xi; y2 = y1; y1 = y; x[i] = y;
  }
}
// 1. Ordnung, Bilinear: H(s) = (1 + s*Tz) / (1 + s*Tp)
function shelf1(x, Tz, Tp, fs) {
  const K = 2 * fs;
  const b0 = 1 + K * Tz, b1 = 1 - K * Tz, a0 = 1 + K * Tp, a1 = 1 - K * Tp;
  let x1 = 0, y1 = 0;
  for (let i = 0; i < x.length; i++) {
    const y = (b0 * x[i] + b1 * x1 - a1 * y1) / a0;
    x1 = x[i]; y1 = y; x[i] = y;
  }
}
// 1. Ordnung Hochpass, Bilinear: H(s) = sT/(1+sT)
function hp1(x, T, fs) {
  const K = 2 * fs;
  const b0 = K * T, b1 = -K * T, a0 = 1 + K * T, a1 = 1 - K * T;
  let x1 = 0, y1 = 0;
  for (let i = 0; i < x.length; i++) {
    const y = (b0 * x[i] + b1 * x1 - a1 * y1) / a0;
    x1 = x[i]; y1 = y; x[i] = y;
  }
}

function compress(chs, fs, thrDb, ratio) {
  const n = chs[0].length, att = Math.exp(-1 / (0.003 * fs)), rel = Math.exp(-1 / (0.15 * fs));
  const thr = Math.pow(10, thrDb / 20);
  let env = 0;
  for (let i = 0; i < n; i++) {
    let p = 0;
    for (const c of chs) { const v = Math.abs(c[i]); if (v > p) p = v; }
    env = p > env ? att * env + (1 - att) * p : rel * env + (1 - rel) * p;
    let g = 1;
    if (env > thr) g = Math.pow(env / thr, 1 / ratio - 1);
    for (const c of chs) c[i] *= g;
  }
}

// RIAA-Zeitkonstanten
const T1 = 3180e-6, T2 = 318e-6, T3 = 75e-6;

// chs: Float32Array[] (1 oder 2 Kanäle) bei Abtastrate fs (= N*rpm/60)
// P: Parameter (siehe Oberfläche); alle Längen in mm
function prepare(chs, fs, P) {
  const N = P.N;
  const stereo = P.stereo && chs.length > 1;
  let a;
  if (stereo) a = [Float32Array.from(chs[0]), Float32Array.from(chs[1])];
  else {
    const m = new Float32Array(chs[0].length);
    for (const c of chs) for (let i = 0; i < m.length; i++) m[i] += c[i] / chs.length;
    a = [m];
  }
  const Ma = a[0].length;
  // --- Filter ---
  for (const c of a) {
    if (P.hpHz > 0) biquad(c, rbj('hp', P.hpHz, Math.SQRT1_2, fs));
    if (P.lpHz > 0 && P.lpHz < 0.48 * fs) {
      biquad(c, rbj('lp', P.lpHz, 0.5412, fs));
      biquad(c, rbj('lp', P.lpHz, 1.3066, fs));
    }
  }
  if (P.compress) compress(a, fs, -20, 3);
  // Ein-/Ausblenden 15 ms
  const fadeN = Math.min(Math.floor(0.015 * fs), Ma >> 2);
  for (const c of a) for (let i = 0; i < fadeN; i++) { const g = i / fadeN; c[i] *= g; c[Ma - 1 - i] *= g; }
  // Vorschau = das, was nach RIAA-Wiedergabe herauskommen sollte
  const preview = a.map(c => Float32Array.from(c));
  if (P.riaa) for (const c of preview) hp1(c, T1, fs);
  let pk = 1e-9; for (const c of preview) for (let i = 0; i < c.length; i++) pk = Math.max(pk, Math.abs(c[i]));
  for (const c of preview) for (let i = 0; i < c.length; i++) c[i] *= 0.9 / pk;
  // Auslenkung (Displacement): RIAA-Aufnahmekurve inkl. 50-Hz-HP => Shelf (1+sT3)/(1+sT2)
  if (P.riaa) for (const c of a) shelf1(c, T3, T2, fs);

  // --- Layout / Rillenabstand ---
  const h = P.grooveW / 2;
  const Lin = N, Lout = 2 * N, M = Lin + Ma + Lout;
  const revs = Ma / N;
  const avail = P.rStart - 2 * h - P.pitchIn - P.rMin; // Platz für Audio-Windungen
  let A = P.ampMax;
  if (P.autoFit) {
    const Afit = (avail - revs * (P.grooveW + P.land)) / (2 * revs + 1);
    A = Math.min(P.ampMax, Afit);
  }
  const minA = 0.006;
  if (!(A >= minA)) {
    const maxRevs = (avail - minA) / (P.grooveW + P.land + 2 * minA);
    const maxSec = maxRevs * 60 / P.rpm;
    throw new Error(JSON.stringify({ k: 'err_long', max: Math.max(0, Math.floor(maxSec / 60)) + ':' + String(Math.max(0, Math.floor(maxSec % 60))).padStart(2, '0') }));
  }
  const pitch = P.grooveW + 2 * A + P.land;

  // Rillenmitte rc(i)
  const rc = new Float64Array(M);
  const ramp = N >> 2;
  let r = P.rStart - h;
  for (let i = 0; i < M; i++) {
    rc[i] = r;
    let p;
    if (i < Lin - ramp) p = P.pitchIn;
    else if (i < Lin) p = P.pitchIn + (pitch - P.pitchIn) * (i - (Lin - ramp)) / ramp;
    else if (i < Lin + Ma) p = pitch;
    else if (i < Lin + Ma + ramp) p = pitch + (P.pitchOut - pitch) * (i - Lin - Ma) / ramp;
    else p = P.pitchOut;
    r -= p / N;
  }
  const rAudioEnd = rc[Lin + Ma - 1];
  if (rAudioEnd - h - A < P.rMin - 1e-6 && !P.autoFit) {
    throw new Error(JSON.stringify({ k: 'err_long2', r: (rAudioEnd - h - A).toFixed(1), min: P.rMin }));
  }

  // --- Pegel: Amplitude + Steigung (Tracking) ---
  let pkA = 1e-12, pkS = 1e-12, pkV = 1e-12;
  const dTheta = 2 * Math.PI / N;
  for (let i = 0; i < Ma; i++) {
    const ds = rc[Lin + i] * dTheta;
    for (const c of a) {
      const v = Math.abs(c[i]); if (v > pkA) pkA = v;
      if (i + 1 < Ma) { const s = Math.abs(c[i + 1] - c[i]) / ds; if (s > pkS) pkS = s; }
    }
    if (stereo) { const v = Math.abs(a[0][i] - a[1][i]) / 2; if (v > pkV) pkV = v; }
  }
  const gA = A / pkA, gS = P.maxSlope / pkS;
  const gV = stereo ? (P.vertFrac * A) / pkV : Infinity;
  const g = Math.min(gA, gS, gV);
  const limitedBy = g === gA ? 'lim_amp' : (g === gS ? 'lim_slope' : 'lim_vert');

  // --- Rillen-Arrays ---
  const r1 = new Float32Array(M), r4 = new Float32Array(M), rb = new Float32Array(M), zb = new Float32Array(M);
  const aL = a[0], aR = stereo ? a[1] : a[0];
  for (let i = 0; i < M; i++) {
    let L = 0, R = 0;
    const k = i - Lin;
    if (k >= 0 && k < Ma) { L = aL[k] * g; R = aR[k] * g; }
    // innere Flanke (Richtung Zentrum) = linker Kanal, äußere Flanke = rechter Kanal (45/45)
    r1[i] = rc[i] + h + R;
    r4[i] = rc[i] - h + L;
    rb[i] = rc[i] + (L + R) / 2;
    zb[i] = -h + (L - R) / 2;
  }
  const rLabel = rc[M - 1] - h - 0.5;
  if (rLabel < P.rHole + 1.5) throw new Error(JSON.stringify({ k: 'err_label' }));

  const tris = countTris(N, M);
  const vOut = 2 * Math.PI * rc[Lin] * P.rpm / 60, vIn = 2 * Math.PI * rAudioEnd * P.rpm / 60; // mm/s
  return {
    G: { N, M, r1, r4, rb, zb, T: P.thick, rDisc: P.diam / 2, rLabel, rHole: P.rHole },
    preview,
    stats: {
      N, M, fs, Ma, duration: Ma / fs, A, pitch, gain: g, limitedBy,
      levelDb: 20 * Math.log10(g * pkA / A),
      rAudioStart: rc[Lin] + h + A, rAudioEnd: rAudioEnd - h - A, rLabel,
      tris, bytes: 84 + tris * 50,
      vOut, vIn, stereo
    }
  };
}

function countTris(N, M) {
  return (M - 1) * 4 + (M - N - 1) * 2 + 2 + 2 * ((N - 1) * 2 + 4) + 4 * (2 * N);
}

// ---------- STL-Erzeugung (binär, gestreamt) ----------
function genMesh(G, chunkTris, onChunk, onProgress) {
  const { N, M, r1, r4, rb, zb, T, rDisc, rLabel, rHole } = G;
  const C = new Float64Array(N), S = new Float64Array(N);
  for (let j = 0; j < N; j++) { const t = 2 * Math.PI * j / N; C[j] = Math.cos(t); S[j] = Math.sin(t); }
  let buf = new ArrayBuffer(chunkTris * 50), dv = new DataView(buf), n = 0, total = 0;
  function flush() {
    if (n === 0) return;
    onChunk(n === chunkTris ? buf : buf.slice(0, n * 50));
    buf = new ArrayBuffer(chunkTris * 50); dv = new DataView(buf); total += n; n = 0;
  }
  function tri(ax, ay, az, bx, by, bz, cx, cy, cz, rx, ry, rz) {
    const ux = bx - ax, uy = by - ay, uz = bz - az, vx = cx - ax, vy = cy - ay, vz = cz - az;
    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    let o = n * 50;
    if (nx * rx + ny * ry + nz * rz < 0) {
      nx = -nx; ny = -ny; nz = -nz;
      let t = bx; bx = cx; cx = t; t = by; by = cy; cy = t; t = bz; bz = cz; cz = t;
    }
    const l = Math.hypot(nx, ny, nz) || 1;
    dv.setFloat32(o, nx / l, true); dv.setFloat32(o + 4, ny / l, true); dv.setFloat32(o + 8, nz / l, true);
    dv.setFloat32(o + 12, ax, true); dv.setFloat32(o + 16, ay, true); dv.setFloat32(o + 20, az, true);
    dv.setFloat32(o + 24, bx, true); dv.setFloat32(o + 28, by, true); dv.setFloat32(o + 32, bz, true);
    dv.setFloat32(o + 36, cx, true); dv.setFloat32(o + 40, cy, true); dv.setFloat32(o + 44, cz, true);
    dv.setUint16(o + 48, 0, true);
    if (++n === chunkTris) flush();
  }
  // Punkt-Helfer -> [x,y,z]
  const X = (r, j) => r * C[j % N], Y = (r, j) => r * S[j % N];
  const p1 = i => [X(r1[i], i), Y(r1[i], i), T];
  const pb = i => [X(rb[i], i), Y(rb[i], i), T + zb[i]];
  const p4 = i => [X(r4[i], i), Y(r4[i], i), T];
  const ring = (R, j, z) => [X(R, j), Y(R, j), z];
  const up = [0, 0, 1];
  const T3 = (a, b, c, ref) => tri(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2], ref[0], ref[1], ref[2]);
  const Q4 = (a, b, c, d, ref) => { T3(a, b, c, ref); T3(a, c, d, ref); };

  // 1) Rille: Flanken + Stege (heißer Pfad, inline)
  const T_ = T;
  for (let i = 0; i < M - 1; i++) {
    const j0 = i % N, j1 = (i + 1) % N;
    const c0 = C[j0], s0 = S[j0], c1 = C[j1], s1 = S[j1];
    const a1x = r1[i] * c0, a1y = r1[i] * s0, b1x = r1[i + 1] * c1, b1y = r1[i + 1] * s1;
    const abx = rb[i] * c0, aby = rb[i] * s0, abz = T_ + zb[i];
    const bbx = rb[i + 1] * c1, bby = rb[i + 1] * s1, bbz = T_ + zb[i + 1];
    const a4x = r4[i] * c0, a4y = r4[i] * s0, b4x = r4[i + 1] * c1, b4y = r4[i + 1] * s1;
    // äußere Flanke
    tri(a1x, a1y, T_, b1x, b1y, T_, bbx, bby, bbz, 0, 0, 1);
    tri(a1x, a1y, T_, bbx, bby, bbz, abx, aby, abz, 0, 0, 1);
    // innere Flanke
    tri(abx, aby, abz, bbx, bby, bbz, b4x, b4y, T_, 0, 0, 1);
    tri(abx, aby, abz, b4x, b4y, T_, a4x, a4y, T_, 0, 0, 1);
    // Steg zur nächsten Windung
    if (i + N + 1 < M) {

      const c2x = r1[k1] * c1, c2y = r1[k1] * s1, d2x = r1[k0] * c0, d2y = r1[k0] * s0;
      tri(a4x, a4y, T_, b4x, b4y, T_, c2x, c2y, T_, 0, 0, 1);
      tri(a4x, a4y, T_, c2x, c2y, T_, d2x, d2y, T_, 0, 0, 1);
    }

  }

  { const e = M - 1, j = e % N; T3(p1(e), pb(e), p4(e), [S[j], -C[j], 0]); }

  // 3) Außenfläche (Rand bis erste Windung)
  for (let j = 0; j < N - 1; j++) Q4(ring(rDisc, j, T), ring(rDisc, j + 1, T), p1(j + 1), p1(j), up);
  {
    const a = ring(rDisc, N - 1, T);
    T3(a, ring(rDisc, 0, T), p1(0), up);
    T3(a, p1(0), p4(0), up);
    T3(a, p4(0), p1(N), up);
    T3(a, p1(N), p1(N - 1), up);
  }
  // 4) Innenfläche (letzte Windung bis Etikett-Kreis)
  {
    const s = M - N - 1; // Index auf dem Strahl des Rillenendes
    for (let j = s + 1; j < M - 1; j++) Q4(p4(j), p4(j + 1), ring(rLabel, j + 1, T), ring(rLabel, j, T), up);
    const ap = ring(rLabel, s + 1, T);
    T3(ap, ring(rLabel, M - 1, T), p4(M - 1), up);

}

const ls = $('lang');
for (const k of Object.keys(I18N)) { const o = document.createElement('option'); o.value = k; o.textContent = I18N[k]._name; ls.append(o); }
ls.value = LANG;
ls.addEventListener('change', () => { LANG = ls.value; try { localStorage.setItem('lprint-lang', LANG); } catch (e) { } applyLang(); });
applyLang();

let dl = null; try { window.claude && window.claude.use && window.claude.use('downloads').then(d => { dl = d; }).catch(() => { }); } catch (e) { }

$('stl').addEventListener('click', async () => {
  if (!st.res || st.busy) return;
  if (st.res.stats.bytes > 4.2e9) { say('too_big'); return; }
  st.busy = true; $('stl').disabled = true; $('calc').disabled = true; bar(0); say('mesh');
  const P = st.P, s = st.res.stats;
  const base = `${st.name}_${P.rpm === 45 ? '45' : P.rpm === 78 ? '78' : '33'}rpm_${s.stereo ? 'stereo' : 'mono'}`;
  try {
    const w = getWorker(), chunks = [];
    const fin = await new Promise((ok, no) => {
      w.onmessage = e => { const d = e.data;
        if (d.type === 'chunk') chunks.push(d.buf);
        else if (d.type === 'progress') bar(d.p * 0.97);
        else if (d.type === 'done') ok(d);
        else if (d.type === 'error') no(new Error(d.msg)); };
      w.postMessage({ cmd: 'mesh', label: base });
    });
    const stlSize = 84 + fin.tris * 50;
    const info = new TextEncoder().encode([
      'LPrint – parameters', 'File: ' + base + '.stl', 'Playing time: ' + fmtT(s.duration) + ' min', 'RPM: ' + P.rpm.toFixed(2),
      'Channels: ' + (s.stereo ? 'Stereo 45/45 (inner wall = L, outer wall = R)' : 'Mono (lateral)'), 'Sample rate: ' + s.fs.toFixed(2) + ' Hz, ' + s.N + ' samples/revolution',
      'Disc: Ø ' + P.diam + ' mm, thickness ' + P.thick + ' mm, center hole ' + (P.rHole * 2).toFixed(2) + ' mm',
      'Groove: ' + Math.round(P.grooveW * 1000) + ' µm wide (90° V), land ' + Math.round(P.land * 1000) + ' µm, pitch ' + Math.round(s.pitch * 1000) + ' µm',
      'Max excursion: ±' + Math.round(s.A * 1000) + ' µm, level ' + s.levelDb.toFixed(1) + ' dB (limited by ' + tEn(s.limitedBy) + ')',
      'Music from r=' + s.rAudioStart.toFixed(2) + ' to r=' + s.rAudioEnd.toFixed(2) + ' mm',
      'Filters: HP ' + P.hpHz + ' Hz, LP ' + Math.round(P.lpHz) + ' Hz, RIAA ' + (P.riaa ? 'on' : 'off') + ', compressor ' + (P.compress ? 'on' : 'off'),
      'Print groove side up, smallest layer height.'].join('\r\n'));
    const parts = zipParts([{ name: base + '.stl', parts: [fin.header, ...chunks], size: stlSize, crc: fin.crc }, { name: 'parameter.txt', parts: [info], size: info.length, crc: crc32(info) }]);
    bar(1);
    const zip = new Blob(parts, { type: 'application/zip' });
    if (dl) {
      try { await dl.save({ filename: base + '.zip', data: zip }); say('saved', { f: base + '.zip', m: Math.round(zip.size / 1e6) }, true); }
      catch (err) { err && err.code === 'declined' ? say('declined') : err && err.code === 'host_unavailable' ? say('host_unav') : say('save_fail', { e: err && (err.message || err.code) }); }
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(zip); a.download = base + '.zip'; document.body.append(a); a.click(); a.remove();
      say('dl', { f: base + '.zip', m: Math.round(zip.size / 1e6) }, true);
    }
  } catch (err) { say('gen_err', { e: err.message || err }); }
  bar(null); st.busy = false; $('stl').disabled = !st.res; $('calc').disabled = !st.buf;
});
}
</script>
</body>
</html>
